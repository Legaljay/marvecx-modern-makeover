<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#ffffff"/>
  <g fill="#ff0055">
    <!-- primary bar: long, bottom-left to top-right -->
    <rect x="8" y="44" width="84" height="12" rx="1.5" transform="rotate(45 50 50)"/>
    <!-- secondary bar: shorter, top-left to bottom-right -->
    <rect x="22" y="44" width="56" height="12" rx="1.5" transform="rotate(-45 50 50)"/>
  </g>
  <!-- orbital arcs: upper-left + lower-right -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#ff0055" stroke-width="9" stroke-dasharray="65.97 65.97"/>
</svg>
